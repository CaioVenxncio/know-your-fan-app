[project]
name = "know-your-fan"
version = "0.3.0"
description = "Independent, synthetic-data-only esports demo: fictional fan profiles and OCR text matching."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Caio Venancio" }]
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Private :: Do Not Upload",
]
# Lower bounds only: the committed uv.lock pins exact versions for reproducibility.
# Each bound is the oldest version the code is known to need (see docs/decisions/0004).
dependencies = [
    "streamlit>=1.60",   # st.dataframe(width="stretch"); lowest version tested
    "pillow>=11.3",      # includes the fix for CVE-2025-48379; ImageFont.load_default(size=...)
    "pytesseract>=0.3.13",  # image_to_string(timeout=...), Python 3.13 support
    "numpy>=2.0",   # seeded noise and bootstrap in the research harness (via Streamlit too)
    "altair>=5.5",  # Research page charts (already installed via Streamlit)
]

[project.urls]
Repository = "https://github.com/CaioVenxncio/know-your-fan-app"

[dependency-groups]
dev = [
    "mypy>=2.0",
    "pip-audit>=2.10",
    "pre-commit>=4.7",
    "pytest>=9.0",
    "pytest-cov>=7.1",
    "ruff>=0.17",
]
# Figures for the research report. Not needed to run the app.
research = [
    "matplotlib>=3.10",
]

[tool.uv]
default-groups = ["dev", "research"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/know_your_fan"]

# ---------------------------------------------------------------- Ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "S",        # bandit security checks
    "PT",       # pytest style
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert by design and seeded (non-cryptographic) RNGs for reproducible data.
"tests/**" = ["S101", "S311"]
# Synthetic data generation is intentionally non-cryptographic and seeded for reproducibility.
"src/know_your_fan/synthetic.py" = ["S311"]
"src/know_your_fan/app.py" = ["S311"]
"src/know_your_fan/research/dataset.py" = ["S311"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts", "main.py"]
warn_unreachable = true

[[tool.mypy.overrides]]
# pytesseract ships no type information and no stub package exists.
module = ["pytesseract", "pytesseract.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "ocr: end-to-end tests that run the real Tesseract engine",
]
filterwarnings = ["error::DeprecationWarning:know_your_fan.*"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["know_your_fan"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_also = ["if TYPE_CHECKING:"]

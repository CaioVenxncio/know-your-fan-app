[client]
# Never show stack traces to visitors. (Streamlit Community Cloud overrides this with
# `false`, which Streamlit renders as "stacktrace"; app.main() therefore catches every
# unexpected error itself.)
showErrorDetails = "none"
toolbarMode = "minimal"

[server]
# The public demo has no file uploads; keep the limit minimal (MB).
maxUploadSize = 1

[browser]
gatherUsageStats = false

# Design tokens (docs/design-system.md). Dark, mostly neutral; one accent.
# WCAG contrast ratios (WCAG 2.x formula), on the page background #19191B unless noted:
#   text #F3F3F4 15.8:1 (12.7:1 on the elevated surface #2B2B2F)
#   secondary text #A9A9B0 7.5:1 (6.0:1 on #2B2B2F)
#   accent #A99AF0 7.2:1 as text; #19191B on the accent (primary buttons) 7.2:1
#   status text: positive #81C9A2 9.0:1, warning #E1B77A 9.4:1, negative #DF8686 6.6:1,
#   info #8FB8E8 8.5:1 (axe-core checks them on the rendered alert backgrounds)
# Structural borders (#34343A) are decorative; form controls get a 3.3:1 outline in ui.py.
[theme]
base = "dark"
primaryColor = "#A99AF0"
backgroundColor = "#19191B"
secondaryBackgroundColor = "#242427"
textColor = "#F3F3F4"
linkColor = "#A99AF0"
borderColor = "#34343A"
showWidgetBorder = true
showSidebarBorder = true
greenTextColor = "#81C9A2"
yellowTextColor = "#E1B77A"
redTextColor = "#DF8686"
blueTextColor = "#8FB8E8"
grayTextColor = "#A9A9B0"
violetTextColor = "#A99AF0"
codeTextColor = "#E4E4E7"
codeBackgroundColor = "#202023"
dataframeHeaderBackgroundColor = "#202023"
dataframeHeaderTextColor = "#A9A9B0"
dataframeBorderColor = "#34343A"
# Local system fonts only: no web-font requests.
font = "system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
headingFont = "system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
codeFont = "ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace"
headingFontSizes = ["2rem", "1.3rem", "1.05rem", "1rem"]
headingFontWeights = [650, 600, 600, 600]
metricValueFontSize = "1.6rem"
metricValueFontWeight = 600
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
# Categorical series: distinct in hue and lightness on #19191B (each >= 6:1); charts also
# vary marker shape, so colour is never the only cue.
chartCategoricalColors = ["#A99AF0", "#74C9D3", "#E1B77A", "#DF8686", "#81C9A2", "#D7A6E0", "#9FB3C8", "#E4E4E7"]

[theme.sidebar]
backgroundColor = "#1F1F22"
secondaryBackgroundColor = "#28282C"
borderColor = "#34343A"

name: CI

on:
  push:
    branches: [main, "deploy/**", phase-1/security-privacy-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Weekly dependency audit (Mondays 06:23 UTC). GitHub runs scheduled workflows
  # only from the default branch, so this trigger takes effect after the final
  # merge into main. Only the dependency-audit job runs on the schedule.
  schedule:
    - cron: "23 6 * * 1"

# Read-only token; no job needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.0"
  PYTHON_VERSION: "3.13"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  quality:
    name: Lint, types, tests (real Tesseract)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install Tesseract OCR and language data
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-por tesseract-ocr-eng
          tesseract --version
          echo "::notice title=Tesseract (ubuntu-24.04)::$(tesseract --version 2>&1 | head -n 1)"
          tesseract --list-langs
          tesseract --list-langs | grep -qx por
          tesseract --list-langs | grep -qx eng

      - name: Install dependencies from the lockfile
        run: uv sync --locked

      - name: Check requirements.txt is in sync with uv.lock
        run: |
          uv export --frozen --no-default-groups --no-emit-project --no-hashes --format requirements-txt \
            | grep -v '^#' > /tmp/expected.txt
          grep -v '^#' requirements.txt | diff -u /tmp/expected.txt -

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: End-to-end OCR tests (real engine, must not skip)
        env:
          KYF_REQUIRE_OCR: "1"
        run: uv run pytest -m ocr -v --no-cov --junitxml=junit-ocr.xml

      - name: Full test suite with coverage
        # Runs even if the OCR step failed, so every failure is reported in one run.
        if: ${{ !cancelled() }}
        env:
          KYF_REQUIRE_OCR: "1"
        run: uv run pytest --cov --cov-report=term-missing --junitxml=junit-all.xml

      - name: Coverage threshold for non-UI code
        run: uv run coverage report --omit='src/know_your_fan/app.py' --fail-under=90

      # Integrity of the committed Phase 4 record: config hashes, dataset fingerprints,
      # manifests, task coverage, frozen selection; then every metric is recomputed from
      # the committed observations (no OCR) and compared with the committed outputs.
      - name: Research record verification and re-analysis
        run: uv run python scripts/verify_research.py --reanalyse

      # Run twice to measure the effect of Tesseract's OpenMP threading on
      # concurrent OCR (the Docker image sets OMP_THREAD_LIMIT=1).
      - name: Bounded operational validation (real Tesseract, default threading)
        run: uv run python scripts/validate_limits.py --real-ocr --github --label default-threads

      - name: Bounded operational validation (real Tesseract, OMP_THREAD_LIMIT=1)
        env:
          OMP_THREAD_LIMIT: "1"
        run: uv run python scripts/validate_limits.py --real-ocr --github --label omp-1-thread

      - name: Report test failures as annotations
        if: ${{ failure() }}
        run: uv run python .github/scripts/junit_to_annotations.py junit-ocr.xml junit-all.xml

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies from the lockfile
        run: uv sync --locked

      - name: pip-audit (runtime and development dependencies)
        run: uv run pip-audit --skip-editable --progress-spinner off

  secret-scan:
    name: Secret scan (full history)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" gitleaks

      - name: gitleaks
        run: ./gitleaks git --redact --no-banner --verbose .

  docker:
    name: Docker image (OCR environment)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --pull -t know-your-fan:ci .

      - name: Image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id know-your-fan:ci -u)" != "0"

      - name: Research page data is present and loadable in the image
        run: |
          docker run --rm --entrypoint python know-your-fan:ci -c '
          from know_your_fan.research import presentation
          explorer = presentation.load_explorer()
          assert explorer is not None, "research_explorer.json missing or malformed"
          assert presentation.load_results().figures, "research figures missing"
          print("research runs:", presentation.total_ocr_runs(explorer))
          '

      - name: Image contains no data, secrets, tests, or tooling
        run: |
          docker run --rm --entrypoint sh know-your-fan:ci -c '
          set -eu
          ls -A /app
          found="$(find /app \( -name "*.db" -o -name "*.db-*" -o -name ".env*" \
            -o -name "secrets.toml" -o -name "*.csv" -o -name "*.csv.gz" -o -name "*.pem" \
            -o -name "*.key" -o -name ".git" -o -name tests -o -name scripts -o -name .github \) \
            -print)"
          if [ -n "$found" ]; then echo "unexpected files in the image:"; echo "$found"; exit 1; fi
          test -z "$(ls -A /app/.data)"
          test "$(ls -A /app/.streamlit)" = "config.toml"
          test "$(ls -A /app/experiments/results | tr "\n" " ")" = "research_explorer.json research_summary.json "
          '

      - name: Tesseract version and languages inside the image
        run: |
          version="$(docker run --rm --entrypoint tesseract know-your-fan:ci --version 2>&1 | head -n 1)"
          echo "::notice title=Tesseract (Docker image)::${version}"
          docker run --rm --entrypoint tesseract know-your-fan:ci --list-langs

      - name: Real OCR on a synthetic specimen inside the image
        run: |
          docker run --rm --entrypoint python know-your-fan:ci -c '
          import dataclasses
          from know_your_fan import ocr, synthetic, text_matching
          base = synthetic.generate_profiles(1, seed=2025)[0]
          for name in (base.name, "João Conceição Gonçalves", "Fábio Falcão Simões"):
              profile = dataclasses.replace(base, name=name)
              text = ocr.extract_text(ocr.render_specimen(profile))
              result = text_matching.match_name(profile.name, text)
              print(profile.name, "->", result)
              assert result.all_found, text
          '

      - name: Application starts and reports healthy
        run: |
          docker run -d --name kyf -p 8501:8501 know-your-fan:ci
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8501/_stcore/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs kyf
          exit 1

  # Approximates Streamlit Community Cloud, which runs Debian 11 ("bullseye"), installs the
  # apt packages in packages.txt, and installs Python dependencies from uv.lock. This checks
  # the distribution's (older) Tesseract with the app's real OCR tests, limits, and start-up
  # under the configuration that Community Cloud enforces. It is not the hosted platform.
  cloud-parity:
    name: Community Cloud parity (Debian 11, packages.txt)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: debian:bullseye-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the apt packages listed in packages.txt
        run: |
          # Debian 11 is end-of-life: its security updates are listed by deb.debian.org but
          # their files now return 404 there, so read them from archive.debian.org.
          # (Container-only workaround; it says nothing about Community Cloud's mirrors.)
          sed -i 's|http://deb.debian.org/debian-security|http://archive.debian.org/debian-security|' \
            /etc/apt/sources.list
          apt-get update -q
          # shellcheck disable=SC2046
          apt-get install -y --no-install-recommends ca-certificates curl $(grep -v '^[[:space:]]*#' packages.txt)
          tesseract --version
          echo "::notice title=Tesseract (Debian 11 packages.txt)::$(tesseract --version 2>&1 | head -n 1)"
          tesseract --list-langs

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies from the lockfile
        run: uv sync --locked

      - name: Engine is at least Tesseract 4 with por and eng data
        run: |
          uv run python -c '
          import pytesseract
          version = pytesseract.get_tesseract_version()
          languages = set(pytesseract.get_languages(config=""))
          print(version, sorted(languages))
          assert version.major >= 4, version
          assert {"por", "eng"} <= languages, languages
          '

      - name: Real OCR tests with the distribution engine
        env:
          KYF_REQUIRE_OCR: "1"
        # The version test pins Tesseract >= 5 for the Ubuntu and Docker environments;
        # the step above checks this environment's version instead.
        run: uv run pytest -m ocr -v --no-cov -k "not test_engine_version_and_language_data"

      - name: Bounded operational validation (distribution engine)
        env:
          OMP_THREAD_LIMIT: "1"
        run: uv run python scripts/validate_limits.py --real-ocr --github --label debian11

      - name: App starts with the configuration Community Cloud enforces
        env:
          STREAMLIT_CLIENT_SHOW_ERROR_DETAILS: "false"
          STREAMLIT_RUNNER_FAST_RERUNS: "true"
          STREAMLIT_SERVER_RUN_ON_SAVE: "true"
          STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION: "true"
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: "true"
        run: |
          uv run streamlit run main.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          for _ in $(seq 1 45); do
            if curl -sf http://localhost:8501/_stcore/health; then
              echo
              ! grep -E "Traceback|ERROR" streamlit.log
              exit 0
            fi
            sleep 2
          done
          cat streamlit.log
          exit 1
